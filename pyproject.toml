[project]
name = "napominator"
version = "0.1.0"
description = "Personal Telegram reminder assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "rapidfuzz>=3.9",
    "timezonefinder>=8.0",
    "geonamescache>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5"]
sentry = ["sentry-sdk>=2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
    "pip-audit",
    "pre-commit",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/napominator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "DTZ", "ASYNC", "S", "PT", "RUF", "C4", "PL", "TID", "T20", "ARG", "PTH", "RET"]
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG", "DTZ001", "DTZ007"]  # naive *_local datetimes are intentional
"migrations/**" = ["E501"]
"src/napominator/infrastructure/db/types.py" = ["ARG002"]  # signatures dictated by SQLAlchemy
"src/napominator/nlp/__main__.py" = ["T201"]
"tests/bot/harness.py" = ["ASYNC109", "ASYNC110"]  # BaseSession.make_request signature is dictated by aiogram
"src/napominator/bot/handlers/*" = ["PLR0917"]  # aiogram injects dependencies by parameter name

[tool.ruff.lint.isort]
known-first-party = ["napominator"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pymorphy3.*", "rapidfuzz.*", "dateutil.*", "pgserver.*", "timezonefinder.*", "geonamescache.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: needs a PostgreSQL server (TEST_POSTGRES_URL, or the bundled pgserver)"]

[tool.coverage.run]
source = ["src/napominator"]
branch = true
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs code in greenlets
omit = ["src/napominator/__main__.py", "src/napominator/nlp/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]
